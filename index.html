<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Códigos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #F4F4F0;
      color: #1A1A1A;
      min-height: 100vh;
    }

    /* ── LAYOUT ── */
    .app { display: flex; min-height: 100vh; }

    /* SIDEBAR CONFIG */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: #1A1A1E;
      color: #E8E8E4;
      padding: 1.5rem 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .brand { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 0.25rem; }
    .brand-icon {
      width: 32px; height: 32px;
      background: #C8F56A;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .brand-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .brand-sub { font-size: 0.7rem; color: #5A5A6A; }

    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #5A5A6A;
      margin-bottom: 0.5rem;
    }
    .field { margin-bottom: 0.75rem; }
    .field label { display: block; font-size: 0.78rem; color: #9A9AAA; margin-bottom: 0.375rem; }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      background: #26262C;
      border: 1px solid #333340;
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      color: #E8E8E4;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #C8F56A; }
    select option { background: #26262C; }

    .preview-id {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: #C8F56A;
      background: rgba(200,245,106,0.08);
      border: 1px solid rgba(200,245,106,0.2);
      border-radius: 6px;
      padding: 0.4rem 0.625rem;
      margin-top: 0.375rem;
    }

    .divider { height: 1px; background: #2A2A32; margin: 0.25rem 0; }

    .btn-generate {
      width: 100%;
      padding: 0.875rem;
      background: #C8F56A;
      color: #1A1A1E;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: auto;
    }
    .btn-generate:hover { background: #d9ff7a; transform: translateY(-1px); }
    .btn-generate:active { transform: none; }

    /* MAIN AREA */
    .main { flex: 1; padding: 1.5rem; min-width: 0; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .top-bar-left h2 { font-size: 1rem; font-weight: 700; }
    .top-bar-left p { font-size: 0.78rem; color: #777; margin-top: 0.125rem; }

    .top-actions { display: flex; gap: 0.5rem; }
    .btn {
      padding: 0.5rem 0.875rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-dark { background: #1A1A1E; color: #E8E8E4; }
    .btn-dark:hover { background: #26262C; }
    .btn-outline { background: white; color: #1A1A1E; border: 1.5px solid #D8D8D0; }
    .btn-outline:hover { border-color: #aaa; }

    /* TOGGLE */
    .toggle-group {
      display: flex;
      background: white;
      border: 1.5px solid #D8D8D0;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .toggle-group button {
      padding: 0.35rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: #777;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-group button.active {
      background: #1A1A1E;
      color: white;
    }

    /* EMPTY STATE */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: #999;
      text-align: center;
      gap: 0.75rem;
    }
    .empty-icon { font-size: 3rem; opacity: 0.3; }
    .empty h3 { font-size: 1rem; color: #555; }
    .empty p { font-size: 0.82rem; max-width: 280px; line-height: 1.5; }

    /* CODE GRID */
    .code-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .code-grid.thermal {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }

    /* CODE CARD */
    .code-card {
      background: white;
      border: 1.5px solid #E4E4DC;
      border-radius: 10px;
      padding: 1rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.625rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .code-card:hover { border-color: #bbb; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .code-img-wrap {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
    }
    .code-img-wrap canvas { display: block; }
    .code-img-wrap svg { display: block; }
    .code-id {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1A1A1A;
      letter-spacing: 0.02em;
    }
    .code-dl {
      padding: 0.3rem 0.75rem;
      font-size: 0.72rem;
      border-radius: 6px;
      background: #F4F4F0;
      color: #555;
      border: 1px solid #E4E4DC;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }
    .code-dl:hover { background: #EBEBE4; }

    /* PRINT */
    @page { margin: 6mm; size: auto; }
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: white; }
      .sidebar, .top-bar, .code-dl { display: none !important; }
      .app { display: block; }
      .main { padding: 0; }
      .code-grid {
        display: grid !important;
        grid-template-columns: repeat(var(--print-cols, 4), 1fr);
        gap: 3px;
        padding: 0;
        width: 100%;
      }
      .code-card {
        border: 1px solid #ccc;
        border-radius: 3px;
        padding: 5px 3px 3px;
        break-inside: avoid;
        page-break-inside: avoid;
        gap: 3px;
      }
      .code-id { font-size: 0.65rem; }
      .code-img-wrap canvas,
      .code-img-wrap svg { max-width: 100%; height: auto !important; }
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; }
      .btn-generate { margin-top: 0; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">⬛</div>
        <div>
          <div class="brand-name">Generador</div>
          <div class="brand-sub">Códigos de inventario</div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">1 · Prefijo</div>
      <div class="field">
        <label>Prefijo del código</label>
        <input type="text" id="prefix" value="INV-" maxlength="12" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Número inicial</label>
        <input type="number" id="start" value="1" min="0" oninput="updatePreview()">
      </div>
      <div class="field">
        <label>Dígitos (relleno con ceros)</label>
        <select id="padding" onchange="updatePreview()">
          <option value="1">Sin relleno — 1, 2, 3</option>
          <option value="2">2 dígitos — 01, 02</option>
          <option value="3" selected>3 dígitos — 001, 002</option>
          <option value="4">4 dígitos — 0001, 0002</option>
        </select>
      </div>
      <div class="preview-id" id="preview-id">Vista previa: INV-001</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">2 · Cantidad</div>
      <div class="field">
        <label>¿Cuántos códigos generar?</label>
        <input type="number" id="count" value="20" min="1" max="500">
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">3 · Tipo de código</div>
      <div class="field">
        <label>Formato</label>
        <select id="code-type">
          <option value="qr">QR Code (recomendado)</option>
          <option value="barcode">Código de barras (1D)</option>
        </select>
      </div>
      <div class="field">
        <label>Tamaño del código</label>
        <select id="code-size">
          <option value="80">Pequeño (80px)</option>
          <option value="120" selected>Mediano (120px)</option>
          <option value="160">Grande (160px)</option>
        </select>
      </div>
    </div>

    <button class="btn-generate" onclick="generate()">Generar códigos →</button>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">
    <div class="top-bar" id="top-bar" style="display:none">
      <div class="top-bar-left">
        <h2 id="result-title">Códigos generados</h2>
        <p id="result-sub"></p>
      </div>
      <div class="top-actions">
        <div class="toggle-group">
          <button class="active" onclick="setLayout('grid',this)">⊞ Cuadrícula</button>
          <button onclick="setLayout('thermal',this)">≡ Térmica</button>
        </div>
        <button class="btn btn-outline" onclick="downloadZip()">⬇ ZIP</button>
        <select id="print-cols" class="btn btn-outline" onchange="setPrintCols(this.value)" title="Columnas al imprimir">
          <option value="2">2 por fila</option>
          <option value="3">3 por fila</option>
          <option value="4" selected>4 por fila</option>
          <option value="5">5 por fila</option>
          <option value="6">6 por fila</option>
        </select>
        <button class="btn btn-dark" onclick="window.print()">🖨 Imprimir</button>
      </div>
    </div>

    <div id="empty-state" class="empty">
      <div class="empty-icon">⬛</div>
      <h3>Configure y genere sus códigos</h3>
      <p>Use el panel izquierdo para definir el prefijo, la cantidad y el tipo de código, luego presione <strong>Generar</strong>.</p>
    </div>

    <div id="code-grid" class="code-grid"></div>
  </main>
</div>

<script>
  let codes = [];
  let currentType = 'qr';
  let currentSize = 120;

  function pad(n, digits) { return String(n).padStart(digits, '0'); }

  function updatePreview() {
    const prefix = document.getElementById('prefix').value;
    const start = parseInt(document.getElementById('start').value) || 1;
    const digits = parseInt(document.getElementById('padding').value);
    document.getElementById('preview-id').textContent = 'Vista previa: ' + prefix + pad(start, digits);
  }

  function generate() {
    const prefix = document.getElementById('prefix').value.trim();
    const start = parseInt(document.getElementById('start').value) || 1;
    const count = Math.min(parseInt(document.getElementById('count').value) || 1, 500);
    const digits = parseInt(document.getElementById('padding').value);
    currentType = document.getElementById('code-type').value;
    currentSize = parseInt(document.getElementById('code-size').value);

    codes = [];
    for (let i = 0; i < count; i++) {
      codes.push(prefix + pad(start + i, digits));
    }

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('top-bar').style.display = 'flex';
    document.getElementById('result-title').textContent = count + ' códigos generados';
    document.getElementById('result-sub').textContent = codes[0] + ' → ' + codes[codes.length - 1];

    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('code-grid');
    grid.innerHTML = codes.map((id, i) => `
      <div class="code-card" id="card-${i}">
        <div class="code-img-wrap" id="img-${i}"></div>
        <div class="code-id">${escHtml(id)}</div>
        <button class="code-dl" onclick="dlSingle(${i})">⬇ Descargar</button>
      </div>
    `).join('');

    // Generate codes after DOM is ready
    requestAnimationFrame(() => {
      codes.forEach((id, i) => {
        const wrap = document.getElementById('img-' + i);
        if (!wrap) return;
        if (currentType === 'qr') {
          try {
            new QRCode(wrap, {
              text: id,
              width: currentSize,
              height: currentSize,
              correctLevel: QRCode.CorrectLevel.M
            });
          } catch(e) { wrap.textContent = 'Error QR'; }
        } else {
          const canvas = document.createElement('canvas');
          wrap.appendChild(canvas);
          try {
            JsBarcode(canvas, id, {
              format: 'CODE128',
              width: currentSize > 120 ? 2.5 : 1.8,
              height: Math.round(currentSize * 0.45),
              displayValue: false,
              margin: 4,
              background: '#ffffff',
              lineColor: '#000000'
            });
          } catch(e) { wrap.textContent = 'Error barcode'; }
        }
      });
    });
  }

  function setLayout(type, btn) {
    const grid = document.getElementById('code-grid');
    grid.className = 'code-grid' + (type === 'thermal' ? ' thermal' : '');
    document.querySelectorAll('.toggle-group button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function getCanvas(index) {
    const wrap = document.getElementById('img-' + index);
    if (!wrap) return null;
    return wrap.querySelector('canvas');
  }

  function dlSingle(index) {
    const canvas = getCanvas(index);
    if (!canvas) return;
    const a = document.createElement('a');
    a.download = codes[index] + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  async function downloadZip() {
    if (!codes.length) return;
    const btn = document.querySelector('.btn-outline');
    btn.textContent = 'Generando…';
    btn.disabled = true;

    try {
      const zip = new JSZip();
      for (let i = 0; i < codes.length; i++) {
        const canvas = getCanvas(i);
        if (!canvas) continue;
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.split(',')[1];
        zip.file(codes[i] + '.png', base64, { base64: true });
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'codigos_' + (document.getElementById('prefix').value || 'lote') + '.zip';
      a.click();
    } catch(e) {
      alert('Error al generar ZIP: ' + e.message);
    }

    btn.textContent = '⬇ ZIP';
    btn.disabled = false;
  }

  function setPrintCols(n) {
    document.getElementById('code-grid').style.setProperty('--print-cols', n);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  updatePreview();
</script>
</body>
</html>
